<div class="login-container">
  <p-card styleClass="login-card">
    <ng-template #title>
      <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Log in to the ITI Student Management System</p>
      </div>
    </ng-template>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          pInputText
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Enter your email"
          class="w-full"
          [ngClass]="{'ng-invalid ng-dirty': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
        />
        <small class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <p-password 
          id="password" 
          formControlName="password" 
          placeholder="Enter your password"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          [feedback]="false"
          [ngClass]="{'ng-invalid ng-dirty': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
        </p-password>
        <small class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters.
        </small>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full form-error"></p-message>

      <p-button type="submit" label="Log In" [loading]="isLoading" [disabled]="loginForm.invalid" styleClass="w-full btn-block"></p-button>
    </form>
  </p-card>
</div>
