<div class="management-container">
  <p-card styleClass="premium-card">
    <div class="header-row">
      <div class="title-section">
        <h2>Branch Management</h2>
        <p>Manage ITI branches and their managers</p>
      </div>
      <p-button *ngIf="isAdmin()" label="Add Branch" icon="pi pi-plus" (onClick)="openAddModal()" [disabled]="isLoading()"></p-button>
    </div>

    <p-table [value]="branches()" [loading]="isLoading()" dataKey="id" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>Name</th>

          <th>Manager</th>
          <th>Status</th>
          <th *ngIf="isAdmin()">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-branch>
        <tr>
          <td>{{ branch.name }}</td>

          <td>
            <span *ngIf="branch.managerName" class="manager-chip">
              <i class="pi pi-user"></i> {{ branch.managerName }}
            </span>
            <span *ngIf="!branch.managerName" class="unassigned-label">— Unassigned</span>
          </td>
          <td>
            <span [class]="'status-badge ' + (branch.isActive ? 'status-active' : 'status-inactive')">
              {{ branch.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="actions-cell" *ngIf="isAdmin()">

            <p-button icon="pi pi-pencil" size="small" variant="outlined" (onClick)="openEditModal(branch)"></p-button>
            <p-button icon="pi pi-times" size="small" severity="danger" *ngIf="branch.isActive" (onClick)="deactivateBranch(branch)"></p-button>
            <p-button icon="pi pi-check" size="small" severity="success" *ngIf="!branch.isActive" (onClick)="reactivateBranch(branch)"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template #empty>
        <tr>
          <td [attr.colspan]="isAdmin() ? 6 : 5" class="empty-message">No branches found.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>


  <!-- Edit Modal -->
  <p-dialog [header]="modalTitle()" [visible]="isModalOpen()" (visibleChange)="isModalOpen.set($event)" [modal]="true" [style]="{width: '400px'}" styleClass="premium-modal">
    <form [formGroup]="branchForm" (ngSubmit)="saveBranch()" class="form-container">
      <div class="form-group">
        <label for="name">Branch Name</label>
        <input pInputText id="name" formControlName="name" placeholder="e.g., Qena Branch" class="w-full" />
      </div>

      <div class="form-group">
        <label for="managerId">Select Manager</label>
        <p-select id="managerId" formControlName="managerId"
          [options]="availableManagers()"
          optionLabel="fullName"
          optionValue="id"
          placeholder="Select a manager"
          styleClass="w-full">
        </p-select>
      </div>
      <div class="modal-footer">
        <p-button label="Cancel" severity="secondary" variant="outlined" (onClick)="closeModal()"></p-button>
        <p-button type="submit" label="Save" [loading]="isLoading()" [disabled]="branchForm.invalid"></p-button>
      </div>
    </form>
  </p-dialog>
  
  <p-confirmDialog></p-confirmDialog>
</div>
