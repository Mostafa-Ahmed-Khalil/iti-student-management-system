<div class="app-shell" [class.is-guest]="!authStore.isLoggedIn()">
  <p-toolbar *ngIf="authStore.isLoggedIn() && !isLoginRoute()" styleClass="app-header">
    <ng-template #start>
      <div class="logo">ITI SMS</div>
      
      <nav class="main-nav" *ngIf="authStore.activeRole() === 'Admin'">
        <a routerLink="/admin/branches" routerLinkActive="active">Branches</a>
        <a routerLink="/admin/users" routerLinkActive="active">Users</a>
      </nav>
      
      <nav class="main-nav" *ngIf="authStore.activeRole() === 'Branch Manager'">
        <a routerLink="/branch-manager/tracks" routerLinkActive="active">Tracks</a>
      </nav>

      <nav class="main-nav" *ngIf="authStore.activeRole() === 'Technical Supervisor'">
        <a routerLink="/supervisor/tracks" routerLinkActive="active">My Tracks</a>
        <a routerLink="/supervisor/students" routerLinkActive="active">Students</a>
      </nav>
    </ng-template>
    
    <ng-template #end>
      <div class="user-controls">
        <div class="role-switcher">
          <span>Viewing as:</span>
          <p-select *ngIf="authStore.allRoles().length > 1; else singleRole" 
                  [options]="authStore.allRoles()"
                  [ngModel]="authStore.activeRole()" 
                  (onChange)="switchRole($event.value)"
                  size="small">
          </p-select>
          <ng-template #singleRole>
            <span class="role-badge">{{ authStore.activeRole() }}</span>
          </ng-template>
        </div>
        
        <p-button label="Logout" icon="pi pi-sign-out" severity="secondary" variant="outlined" size="small" (onClick)="logout()"></p-button>
      </div>
    </ng-template>
  </p-toolbar>
  
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <p-toast></p-toast>
  <p-toast key="loading-toast" position="bottom-center" [baseZIndex]="9999">
    <ng-template #message let-message>
      <div class="loading-toast-content">
        <i class="pi pi-spin pi-spinner"></i>
        <span>{{ message.detail }}</span>
      </div>
    </ng-template>
  </p-toast>
  <app-spinner></app-spinner>
</div>
