<div class="app-shell" [class.is-guest]="!authStore.isLoggedIn()">
  <header class="app-header" *ngIf="authStore.isLoggedIn()">
    <div class="logo">ITI Student Management System</div>
    
    <div class="user-controls">
      <div class="role-switcher">
        <span>Viewing as:</span>
        <select *ngIf="authStore.allRoles().length > 1; else singleRole" 
                [value]="authStore.activeRole()" 
                (change)="switchRole($event)"
                class="role-select">
          <option *ngFor="let role of authStore.allRoles()" [value]="role">{{ role }}</option>
        </select>
        <ng-template #singleRole>
          <span class="role-badge">{{ authStore.activeRole() }}</span>
        </ng-template>
      </div>
      
      <button class="btn btn-outline" (click)="logout()">Logout</button>
    </div>
  </header>
  
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <div class="toast-container" *ngIf="toastService.toasts().length > 0">
    <div *ngFor="let toast of toastService.toasts()" class="toast" [ngClass]="'toast-' + toast.type">
      {{ toast.message }}
      <button class="toast-close" (click)="toastService.remove(toast.id)">&times;</button>
    </div>
  </div>
</div>
